name: CI

# Claude Code checks the plugin itself: `plugin validate --strict` refuses what
# the engine would refuse, and `plugin test` runs tests/ against the real
# engine. Neither needs a login. tsc is not here: the engine's typings are
# written only by a logged-in session, so it runs locally.
#
# Every run takes the latest CLI: the mod API moves between releases, and the
# weekly run catches a break even when nothing is pushed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Node the README promises (type stripping on by default), and the current one.
        node: ['22.18', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - name: Validate
        run: claude plugin validate --strict . < /dev/null
      # relay/relay.mjs is the committed bundle the plugin runs, so a change to its source or to the
      # bundled SDK must come with a rebuilt bundle.
      # Biome formats and lints, and keeps hooks/acp, the generic ACP client, from importing via's own code.
      - name: Lint, and the relay bundle matches its source
        run: |
          npx -y pnpm@12.15.0 install --frozen-lockfile
          npx -y pnpm@12.15.0 lint
          # Hooks may import only their own files: their copies of the harnesses' types must match the published ones.
          npx -y pnpm@12.15.0 check:types
          # The relay, the MCP server and their tests need only Node's types, not the engine's. -p, not -b: build
          # mode leaves .tsbuildinfo files, which the last step refuses.
          npx -y pnpm@12.15.0 exec tsc -p relay
          npx -y pnpm@12.15.0 exec tsc -p mcp
          npx -y pnpm@12.15.0 build:relay
          git diff --exit-code relay/relay.mjs
          npx -y pnpm@12.15.0 test:relay
          npx -y pnpm@12.15.0 test:mcp
          rm -rf node_modules
      - name: Test
        run: claude plugin test . < /dev/null
      - name: The checks left nothing behind
        run: |
          residue=$(git status --porcelain --ignored --untracked-files=all)
          if [ -n "$residue" ]; then
            echo "::error::checking the plugin left files in the working tree"
            echo "$residue"
            exit 1
          fi

  # The real codex-acp and opencode behind the real relay, the model a local fake: no tokens, no network, no
  # login (relay/test/real-*.test.mts). Elsewhere those tests skip, as the harnesses aren't installed. Every
  # version is one Dependabot bumps: codex-acp from relay/codex-acp, installed as via installs it; Codex from
  # ci/codex; OpenCode from ci/opencode/Dockerfile; testy, ACP's reference agent, from ci/testy/Cargo.lock.
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install codex-acp, Codex and OpenCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # codex-acp as via installs it (hooks/install.ts): no optional packages, so no Codex of its own.
          mkdir -p "$RUNNER_TEMP/codex-acp" "$RUNNER_TEMP/codex"
          cp relay/codex-acp/package.json relay/codex-acp/package-lock.json "$RUNNER_TEMP/codex-acp/"
          (cd "$RUNNER_TEMP/codex-acp" && npm ci --ignore-scripts --omit=optional --no-audit --no-fund)
          echo "CODEX_ACP=$RUNNER_TEMP/codex-acp/node_modules/@agentclientprotocol/codex-acp/dist/index.js" >> "$GITHUB_ENV"
          # The person's own codex, which via runs (CODEX_PATH=codex).
          cp ci/codex/package.json ci/codex/package-lock.json "$RUNNER_TEMP/codex/"
          (cd "$RUNNER_TEMP/codex" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "$RUNNER_TEMP/codex/node_modules/.bin" >> "$GITHUB_PATH"
          version=$(sed -n 's|^FROM ghcr.io/anomalyco/opencode:\([^@[:space:]]*\).*|\1|p' ci/opencode/Dockerfile)
          gh release download "v$version" -R anomalyco/opencode -p opencode-linux-x64.tar.gz -D "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode/opencode-linux-x64.tar.gz" -C "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
      # testy (relay/test/testy.test.mts): a few minutes cold, seconds from the cache, keyed on its lockfile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ci/testy -> target
      - name: Build testy
        run: |
          cargo build --locked --manifest-path ci/testy/Cargo.toml
          echo "ACP_TESTY=$PWD/ci/testy/target/debug/testy" >> "$GITHUB_ENV"
      - name: Relay tests, none skipped
        run: |
          set -o pipefail
          codex --version && opencode --version
          npx -y pnpm@12.15.0 install --frozen-lockfile
          npx -y pnpm@12.15.0 test:relay | tee "$RUNNER_TEMP/relay.log"
          grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/relay.log" || { echo "::error::a harness or testy test skipped: one of them is missing"; exit 1; }
